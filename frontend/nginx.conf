server {
    listen 3000;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Flutter web uses client-side routing; unknown paths should fall back
    # to index.html instead of returning nginx's default 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache immutable build assets aggressively; index.html stays uncached
    # so users always get the latest app shell.
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
